<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopSphere — Moderator Panel</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>" />
</head>
<body>
  
  <div class="login-wrap" id="loginGate">
    <div class="login-card">
      <div class="logo"><span class="logo__mark">S</span><span><b>Shop</b><em>Sphere</em></span></div>
      <h2 style="margin:6px 0">Moderator Access</h2>
      <p style="color:var(--muted);margin-bottom:16px">Sign in with an account assigned the moderator role in Supabase.</p>
      <form id="loginForm">
        <div class="field"><label for="moderatorEmail">Email address</label><input type="email" id="moderatorEmail" autocomplete="email" required /></div>
        <div class="field"><label for="moderatorPassword">Password</label><input type="password" id="moderatorPassword" autocomplete="current-password" required /></div>
        <button class="btn btn--primary btn--block" type="submit">Sign in as Moderator</button>
      </form>
      <a href="index.html" style="color:var(--orange-dark);font-weight:700;font-size:.85rem;display:inline-block;margin-top:10px">← Back to Store</a>
    </div>
  </div>

  <div class="admin-shell hidden" id="adminShell">
    
    <aside class="admin-side" id="adminSide">
      <div class="logo"><span class="logo__mark">S</span><span><b>Shop</b>Moderator</span></div>
      <nav class="admin-nav">
        <button data-view="dashboard" class="active">📊 Dashboard</button>
        <button data-view="products">📦 All Listings</button>
        <button data-view="orders">🧾 Sellers &amp; Users</button>
      </nav>
      <div style="margin-top:24px;border-top:1px solid rgba(255,255,255,.1);padding-top:16px">
        <a href="index.html" class="admin-nav" style="display:block"><button>🏬 View Store</button></a>
        <button id="btnLogout" class="admin-nav" style="width:100%;color:#ffb4b4">🚪 Logout</button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div style="display:flex;align-items:center;gap:10px">
          <button class="hamburger admin-menu-btn" id="btnAdminMenu">☰</button>
          <h1 id="viewTitle">Dashboard</h1>
        </div>
      </div>

      <section id="view-dashboard">
        <div class="stats" id="statCards"></div>
        <div class="panel">
          <h3>👥 Registered Sellers</h3>
          <div class="table-wrap"><table class="data" id="lowStockTable"></table></div>
        </div>
        <div class="panel">
          <h3>🕒 Recent Platform Listings</h3>
          <div class="table-wrap"><table class="data" id="recentOrders"></table></div>
        </div>
      </section>

      <section id="view-products" class="hidden">
        <div class="panel">
          <h3>All Platform Products</h3>
          <div class="table-wrap"><table class="data" id="productsTable"></table></div>
        </div>
      </section>

      <section id="view-orders" class="hidden">
        <div class="panel">
          <h3>Registered Sellers &amp; Account Approval</h3>
          <div class="table-wrap"><table class="data" id="ordersTable"></table></div>
        </div>
      </section>

    </main>
  </div>

  <div class="overlay" id="overlay"></div>
  <div class="toast-host" id="toastHost"></div>
  <script src="common.js"></script>
  <script src="admin.js"></script>
</body>
</html>
