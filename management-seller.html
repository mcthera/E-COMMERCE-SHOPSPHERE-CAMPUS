<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopSphere — Seller Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>store</text></svg>" />
</head>
<body>

  <!-- Auth Gate / Loading Check -->
  <div class="login-wrap" id="sellerAuthGate">
    <div class="login-card">
      <div class="logo"><span class="logo__mark">S</span><span><b>Shop</b><em>Sphere</em></span></div>
      <h2 style="margin:6px 0">Seller Portal</h2>
      <p style="color:var(--muted);margin-bottom:16px">Please log in to your seller account to manage your store.</p>
      <a href="index.html" class="btn btn--primary btn--block">Go to Store & Login</a>
    </div>
  </div>

  <!-- Seller Shell -->
  <div class="admin-shell hidden" id="sellerShell">
    <aside class="admin-side" id="sellerSide">
      <div class="logo"><span class="logo__mark">S</span><span><b>My</b>Store</span></div>
      <nav class="admin-nav">
        <button data-view="dashboard" class="active">📊 My Dashboard</button>
        <button data-view="products">📦 My Listings</button>
        <button data-view="orders">🧾 Sales & Orders</button>
      </nav>
      <div style="margin-top:24px;border-top:1px solid rgba(255,255,255,.1);padding-top:16px">
        <a href="index.html" class="admin-nav" style="display:block"><button>🏬 View Marketplace</button></a>
        <button id="btnSellerLogout" class="admin-nav" style="width:100%;color:#ffb4b4">🚪 Logout</button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div style="display:flex;align-items:center;gap:10px">
          <button class="hamburger admin-menu-btn" id="btnSellerMenu">☰</button>
          <h1 id="sellerViewTitle">Dashboard</h1>
        </div>
        <button class="btn btn--primary" id="btnNewListing">＋ Post New Item</button>
      </div>

      <!-- Dashboard View -->
      <section id="view-dashboard">
        <div class="stats" id="sellerStatCards"></div>
        <div class="panel">
          <h3>📦 Your Recent Listings</h3>
          <div class="table-wrap"><table class="data" id="sellerRecentProducts"></table></div>
        </div>
      </section>

      <!-- Products View -->
      <section id="view-products" class="hidden">
        <div class="panel">
          <h3>Manage Your Products</h3>
          <div class="table-wrap"><table class="data" id="sellerProductsTable"></table></div>
        </div>
      </section>

      <!-- Orders / Sales View -->
      <section id="view-orders" class="hidden">
        <div class="panel">
          <h3>Orders for Your Items</h3>
          <div class="table-wrap"><table class="data" id="sellerOrdersTable"></table></div>
        </div>
      </section>
    </main>
  </div>

  <!-- Edit/Add Product Modal -->
  <div class="overlay" id="overlay"></div>
  <div class="modal" id="sellerProductModal">
    <div class="modal__panel">
      <div class="modal__head"><h3 id="sellerModalTitle">Post / Edit Product</h3><button class="close-x" data-close-modal="sellerProductModal">×</button></div>
      <div class="modal__body">
        <form id="sellerProductForm">
          <input type="hidden" id="spId" />
          <div class="grid-2">
            <div class="field"><label>Title *</label><input id="spTitle" required /></div>
            <div class="field"><label>Category *</label><select id="spCategory"></select></div>
          </div>
          <div class="grid-2">
            <div class="field"><label>Price (GH₵) *</label><input id="spPrice" type="number" min="0" step="0.01" required /></div>
            <div class="field"><label>Stock Quantity *</label><input id="spStock" type="number" min="1" value="1" required /></div>
          </div>
          <div class="field"><label>Description</label><textarea id="spDesc" placeholder="Condition, location on campus, details..."></textarea></div>
          <div class="field">
            <label>Product Photos *</label>
            <input type="file" id="spFileInput" accept="image/*" multiple />
          </div>
          <div style="display:flex;gap:10px;margin-top:16px">
            <button type="submit" class="btn btn--green" id="btnSaveListing">💾 Save Listing</button>
            <button type="button" class="btn btn--ghost" data-close-modal="sellerProductModal">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="toast-host" id="toastHost"></div>
  <script src="common.js"></script>
  <script src="management-seller.js"></script>
</body>
</html>
